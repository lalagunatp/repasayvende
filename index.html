<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Repasa y Vende — Totalplay</title>
<meta name="theme-color" content="#0C2431">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repasa y Vende">
<meta name="application-name" content="Repasa y Vende">

<style>
:root{
  --tinta:#0C2431; --tinta2:#16404F; --papel:#EFF2F1; --blanco:#FFFFFF;
  --acento:#E8412D; --oro:#F2A81D; --verde:#12855F; --gris:#5F7280;
  --borde:#D6DEDC; --sombra:0 6px 20px rgba(12,36,49,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--papel); color:var(--tinta); font-size:19px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0 0 10px; line-height:1.15; letter-spacing:-.02em}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:0 0 12px}
.env{max-width:640px;margin:0 auto;padding:16px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin-bottom:6px}
.oculto{display:none !important}

/* ---- Barra superior ---- */
header{background:var(--tinta);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:40}
.barra{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra .marca{font-weight:800;font-size:18px;letter-spacing:-.01em;flex:1}
.barra .marca small{display:block;font-weight:600;font-size:12px;opacity:.7;letter-spacing:.1em;text-transform:uppercase}
.btn-salir{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700}

/* ---- Botones ---- */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:800;
  font-family:inherit;background:var(--acento);color:#fff;box-shadow:var(--sombra);margin-bottom:12px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--blanco);color:var(--tinta);border:2px solid var(--borde);box-shadow:none}
.btn.fantasma{background:transparent;color:var(--gris);border:0;box-shadow:none;font-size:16px;font-weight:700}
.btn:focus-visible,input:focus-visible,.opcion:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* ---- Acceso ---- */
#acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--tinta)}
#acceso .caja{background:#fff;border-radius:22px;padding:28px 22px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#acceso .sello{width:78px;height:78px;margin-bottom:18px}
#acceso .sello svg{width:100%;height:100%;display:block}
.selloChico{width:64px;height:64px;margin:0 auto 14px}
.selloChico svg{width:100%;height:100%;display:block}
.datos{background:#fff;border:1px solid var(--borde);border-radius:18px;overflow:hidden;margin-bottom:20px}
.datos .fila{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:14px 16px;border-bottom:1px solid var(--borde)}
.datos .fila:last-child{border-bottom:0}
.datos .et{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);flex:none}
.datos .va{font-size:18px;font-weight:700;text-align:right}
input[type=text]{width:100%;padding:16px;font-size:22px;font-weight:700;border:2px solid var(--borde);
  border-radius:14px;font-family:inherit;text-align:center;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.aviso{font-size:15px;color:var(--gris);margin-top:10px}
.error{color:var(--acento);font-weight:700}

/* ---- Tarjetas de menú ---- */
.opcion-modo{background:#fff;border:2px solid var(--borde);border-radius:18px;padding:18px;margin-bottom:14px;
  display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;font-family:inherit;font-size:18px}
.opcion-modo .ico{font-size:30px;line-height:1}
.opcion-modo b{display:block;font-size:20px;margin-bottom:2px}
.opcion-modo span{color:var(--gris);font-size:15px;line-height:1.35}

/* ---- Lista de temas ---- */
.tema{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;width:100%;font-family:inherit;font-size:18px;text-align:left;cursor:pointer}
.tema .ico{font-size:26px}
.tema .txt{flex:1}
.tema b{display:block;font-size:18px}
.tema small{color:var(--gris);font-size:14px}
.termo{height:6px;background:var(--borde);border-radius:4px;margin-top:7px;overflow:hidden}
.termo i{display:block;height:100%;background:var(--verde);width:0}

/* ---- Tarjeta didáctica (firma de la app) ---- */
.escena{perspective:1200px;margin:8px 0 16px}
.carta{position:relative;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.2,.8,.25,1);transform-style:preserve-3d}
.carta.volteada{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sombra)}
.cara.frente{background:#fff;border:2px solid var(--borde)}
.cara.dorso{background:var(--tinta2);color:#fff;transform:rotateY(180deg)}
.cara .rot{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-bottom:12px}
.cara .cuerpo{font-size:23px;font-weight:700;line-height:1.35}
.cara.dorso .cuerpo{font-size:20px;font-weight:600}
.toca{text-align:center;color:var(--gris);font-size:15px;margin-bottom:16px;
  background:none;border:0;font-family:inherit;width:100%;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.mando{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 8px}
.redondo{width:60px;height:60px;border-radius:50%;border:2px solid var(--borde);background:#fff;
  display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;font-size:22px;
  font-weight:800;color:var(--tinta);cursor:pointer;flex:none;padding:0}
.redondo:active{transform:scale(.94)}
.redondo[disabled]{opacity:.3}
.redondo.flecha{background:var(--tinta);border-color:var(--tinta);color:#fff;font-size:26px}
.redondo.flecha[disabled]{background:#fff;border-color:var(--borde);color:var(--gris)}
.redondo.mal{width:74px;border-radius:34px;border-color:#F3B7AF;color:var(--acento);font-size:19px}
.redondo.bien{width:74px;border-radius:34px;border-color:#A5D9C5;color:var(--verde);font-size:19px}
.redondo.mal.puesta{background:#FDECEA}
.redondo.bien.puesta{background:#E7F5EF}
.pieMando{text-align:center;color:var(--gris);font-size:14px;margin-bottom:8px}
.bat{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.bat .arriba{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bat b{font-size:17px;font-weight:700}
.bat .est{font-size:14px;font-weight:800;color:var(--gris);white-space:nowrap}
.bat .est.ok{color:var(--verde)}
.bat .est.no{color:var(--acento)}
.bat .barra{height:8px;background:var(--borde);border-radius:5px;overflow:hidden}
.bat .barra i{display:block;height:100%;background:var(--verde);width:0}
.bat .barra i.medio{background:var(--oro)}
.bat .barra i.cero{background:var(--borde)}
.reng{display:flex;align-items:center;gap:9px;margin-top:7px}
.reng .et{font-size:13px;font-weight:800;color:var(--gris);width:96px;flex:none;
  text-transform:uppercase;letter-spacing:.05em}
.reng .barra{flex:1;height:8px;background:var(--borde);border-radius:5px;overflow:hidden}
.reng .cif{font-size:13px;font-weight:800;color:var(--gris);width:44px;text-align:right;flex:none}
.bat .nota{font-size:13px;color:var(--gris);margin-top:6px}
.mini{background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:10px 14px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.mini.quitar{background:#fff;color:var(--acento);border:2px solid var(--borde)}
input.fecha{padding:9px 10px;border:2px solid var(--borde);border-radius:10px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--tinta)}
a.opcion-modo{text-decoration:none;color:inherit}
@media (prefers-reduced-motion:reduce){.carta{transition:none}}

/* ---- Cuestionario ---- */
.pregunta{background:#fff;border:2px solid var(--borde);border-radius:20px;padding:20px;margin-bottom:14px}
.pregunta .txt{font-size:21px;font-weight:700;line-height:1.35}
.opcion{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--borde);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;font-size:18px;font-family:inherit;font-weight:600;cursor:pointer}
.opcion.bien{border-color:var(--verde);background:#E7F5EF}
.opcion.mal{border-color:var(--acento);background:#FDECEA}
.opcion[disabled]{opacity:.75}
.explica{background:#FFF7E4;border-left:5px solid var(--oro);border-radius:12px;padding:14px 16px;font-size:17px;margin-bottom:14px}

/* ---- Progreso ---- */
.progreso{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;font-weight:800;color:var(--gris)}
.progreso .riel{flex:1;height:8px;background:var(--borde);border-radius:5px;overflow:hidden}
.progreso .riel i{display:block;height:100%;background:var(--acento);width:0;transition:width .3s}

/* ---- Resultado ---- */
.marcador{background:var(--tinta);color:#fff;border-radius:22px;padding:26px;text-align:center;margin-bottom:16px}
.marcador .num{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em}
.marcador .lbl{font-size:15px;text-transform:uppercase;letter-spacing:.14em;opacity:.7;margin-top:6px}

/* ---- Reportes ---- */
.ficha{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin-bottom:9px;
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;font-family:inherit;text-align:left;font-size:17px;cursor:pointer}
.ficha b{display:block;font-size:17px}
.ficha small{color:var(--gris);font-size:14px}
.ficha .marca{font-size:14px;font-weight:800;color:var(--gris);white-space:nowrap}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cifra{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px}
.cifra .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.cifra .l{font-size:13px;color:var(--gris);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.falla{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--acento);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:16px}
.falla b{display:block;font-size:16px;margin-bottom:3px}

.vencido{background:#FFF7E4;border:2px solid var(--oro);border-radius:16px;padding:16px;font-size:16px;line-height:1.5}
.vencido b{display:block;font-size:18px;margin-bottom:6px}
.tema.caduco{border-color:var(--oro);background:#FFFCF4}
.etiqueta{display:inline-block;background:var(--oro);color:#3A2A00;font-size:12px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 7px;vertical-align:middle;margin-left:6px}
.etiqueta.nueva{background:var(--verde);color:#fff}
.pie{text-align:center;color:var(--gris);font-size:14px;padding:26px 16px 34px;line-height:1.6}
.pie .firma{margin-top:8px;font-weight:700}
</style>
</head>

  '</svg>';

function norm(v){ return String(v==null?'':v).trim().toUpperCase(); }
function esc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function revolver(a){
  var b = a.slice();
  for (var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function idSesion(){
  return 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* Cronómetro que se pausa cuando la persona sale de la app */
function Crono(){
  this.acum = 0; this.desde = Date.now(); this.corriendo = true;
}
Crono.prototype.pausa = function(){
  if (this.corriendo){ this.acum += Date.now() - this.desde; this.corriendo = false; }
};
Crono.prototype.sigue = function(){
  if (!this.corriendo){ this.desde = Date.now(); this.corriendo = true; }
};
Crono.prototype.segundos = function(){
  var t = this.acum + (this.corriendo ? Date.now() - this.desde : 0);
  return Math.max(0, Math.round(t/1000));
};

/* =====================================================================
   ESTADO
   ===================================================================== */
var USUARIO = null;
var DIRECTORIO = [];
var SESION = null;
var COLA = [];
var CRONO = null;
var VISTA = 'menu';
var RUTA = [];
var DATOS_REPORTE = null;

/* =====================================================================
   DIRECTORIO DE ACCESO
   ===================================================================== */
var LLAVE_DIR = 'cap_directorio_v1';

function cargarDirectorio(alTerminar){
  var guardado = null;
  try { guardado = JSON.parse(localStorage.getItem(LLAVE_DIR) || 'null'); } catch(e){ guardado = null; }

  if (guardado && guardado.filas && guardado.filas.length){
    DIRECTORIO = guardado.filas;
    alTerminar(true);
    if (Date.now() - (guardado.t||0) > 6*3600*1000) bajarDirectorio(function(){});
    return;
  }
  bajarDirectorio(alTerminar);
}

function bajarDirectorio(alTerminar){
  var manejador = 'dirTP' + Date.now().toString(36);
  var url = 'https://docs.google.com/spreadsheets/d/' + HOJA_ACCESO +
            '/gviz/tq?gid=0&headers=1&tq=' + encodeURIComponent('select A,B,C,D,E,F') +
            '&tqx=out:json;responseHandler:' + manejador;
  var listo = false;

  window[manejador] = function(resp){
    listo = true;
    try {
      var filas = [];
      var rows = (resp && resp.table && resp.table.rows) || [];
      for (var i=0;i<rows.length;i++){
        var c = rows[i].c || [];
        var num = c[0] && c[0].v != null ? norm(c[0].v) : '';
        if (!num) continue;
        filas.push({
          num: num,
          nombre: c[1] && c[1].v != null ? String(c[1].v) : '',
          distrito: c[2] && c[2].v != null ? String(c[2].v) : '',
          posicion: c[3] && c[3].v != null ? norm(c[3].v) : '',
          jefe: c[4] && c[4].v != null ? norm(c[4].v) : ''
        });
      }
      if (filas.length){
        DIRECTORIO = filas;
        try { localStorage.setItem(LLAVE_DIR, JSON.stringify({t:Date.now(), filas:filas})); } catch(e){}
      }
    } catch(e){}
    try { delete window[manejador]; } catch(e){ window[manejador] = null; }
    alTerminar(DIRECTORIO.length > 0);
  };

  var s = document.createElement('script');
  s.src = url;
  s.onerror = function(){ if (!listo) alTerminar(DIRECTORIO.length > 0); };
  document.head.appendChild(s);
  setTimeout(function(){ if (!listo) alTerminar(DIRECTORIO.length > 0); }, 12000);
}

function buscarPersona(numero){
  var n = norm(numero);
  for (var i=0;i<DIRECTORIO.length;i++){ if (DIRECTORIO[i].num === n) return DIRECTORIO[i]; }
  return null;
}

/* =====================================================================
   PERMISOS
   ===================================================================== */
function puedeReporte(u){ return !!u && PUESTOS_REPORTE.indexOf(u.posicion) >= 0; }
function esDirector(){ return !!USUARIO && USUARIO.posicion === 'DIRECTOR DISTRITAL'; }

/* ¿Este puesto puede ver el tema? */
function permitidoPara(t, persona){
  var reglas = PERMISOS[t.id];
  if (!reglas) return true;
  if (!persona) return false;
  if (reglas.puestos && reglas.puestos.indexOf(persona.posicion) >= 0) return true;
  if (reglas.prefijos){
    for (var i=0;i<reglas.prefijos.length;i++){
      if (String(persona.num).indexOf(reglas.prefijos[i]) === 0) return true;
    }
  }
  return false;
}
function permitido(t){ return permitidoPara(t, USUARIO); }

/* Las baterías que le tocan a una persona según su puesto */
function bateriasDe(persona){
  var lista = [];
  for (var i=0;i<TEMAS.length;i++){
    if (permitidoPara(TEMAS[i], persona) && vigente(TEMAS[i])) lista.push(TEMAS[i]);
  }
  return lista;
}

/* Lo que el Director haya cambiado desde la app manda sobre el código */
var CONFIG_REMOTA = {};
function aplicarConfig(lista){
  CONFIG_REMOTA = {};
  for (var i=0;i<(lista||[]).length;i++){
    var c = lista[i];
    if (c && c.tema) CONFIG_REMOTA[c.tema] = c;
  }
  try { localStorage.setItem('cap_config', JSON.stringify(lista||[])); } catch(e){}
}
function cargarConfigGuardada(){
  try { aplicarConfig(JSON.parse(localStorage.getItem('cap_config') || '[]')); } catch(e){}
}
function finDe(id){
  var c = CONFIG_REMOTA[id];
  if (c && c.vigencia) return c.vigencia;
  return VIGENCIAS[id];
}
function oculto(t){
  var c = CONFIG_REMOTA[t.id];
  return !!(c && c.oculto);
}

/* ¿Sigue vigente? Vence al terminar el día indicado. */
function vigente(t){
  if (oculto(t)) return false;
  var fin = finDe(t.id);
  if (!fin) return true;
  var p = fin.split('-');
  var limite = new Date(+p[0], +p[1]-1, +p[2], 23, 59, 59);
  return new Date() <= limite;
}
/* ¿Este tema trae marca de "nuevo" o "actualizado"? Solo durante los 15 días
   siguientes a la fecha registrada en NOVEDADES; después desaparece sola. */
function novedadDe(t){
  var n = NOVEDADES[t.id];
  if (!n || !n.fecha) return null;
  var p = n.fecha.split('-');
  var desde = new Date(+p[0], +p[1]-1, +p[2]);
  var dias = Math.floor((new Date() - desde) / 86400000);
  if (dias < 0 || dias > 15) return null;
  return n.tipo === 'actualizado' ? 'actualizado' : 'nuevo';
}
function fechaBonita(iso){
  if (!iso) return '';
  var p = iso.split('-');
  var meses = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
  return (+p[2]) + ' de ' + meses[+p[1]-1] + ' de ' + p[0];
}

/* Lo que ve la persona: lo permitido y vigente.
   El Director además ve lo vencido, con aviso. */
function temasVisibles(){
  var lista = [];
  for (var i=0;i<TEMAS.length;i++){
    var t = TEMAS[i];
    if (!permitido(t)) continue;
    if ((!vigente(t) || oculto(t)) && !esDirector()) continue;
    lista.push(t);
  }
  return lista;
}

/* Para calificar solo entra lo vigente, aunque sea Director */
function temasParaExamen(){
  var lista = [];
  for (var i=0;i<TEMAS.length;i++){
    if (permitido(TEMAS[i]) && vigente(TEMAS[i])) lista.push(TEMAS[i]);
  }
  return lista;
}

function temasVencidos(){
  var lista = [];
  for (var i=0;i<TEMAS.length;i++){
    if (permitido(TEMAS[i]) && !vigente(TEMAS[i]) && !oculto(TEMAS[i])) lista.push(TEMAS[i]);
  }
  return lista;
}
function temaPorId(id){
  for (var i=0;i<TEMAS.length;i++){ if (TEMAS[i].id === id) return TEMAS[i]; }
  return null;
}

/* =====================================================================
   BITÁCORA
   ===================================================================== */
function registrar(modo, tema, item, titulo, respuesta, resultado, segundos){
  if (!USUARIO || !SESION) return;
  COLA.push({
    marca: new Date().toISOString(),
    sesion: SESION.id, numero: USUARIO.num, nombre: USUARIO.nombre,
    distrito: USUARIO.distrito, posicion: USUARIO.posicion,
    modo: modo, tema: tema, item: item, titulo: String(titulo||'').slice(0,180),
    respuesta: String(respuesta==null?'':respuesta).slice(0,180),
    resultado: resultado||'', segundos: segundos||0
  });
  SESION.items++;
  if (resultado === 'bien') SESION.aciertos++;
  if (resultado === 'mal')  SESION.errores++;
  if (COLA.length >= 4) enviar(false);
}

function enviar(final){
  if (!USUARIO || !SESION) return;
  var eventos = COLA.splice(0, COLA.length);
  if (!eventos.length && !final) return;

  var paquete = {
    tipo: 'ambos',
    eventos: eventos,
    sesion: {
      sesion: SESION.id, numero: USUARIO.num, nombre: USUARIO.nombre,
      distrito: USUARIO.distrito, posicion: USUARIO.posicion, modo: SESION.modo,
      inicio: SESION.inicio, fin: new Date().toISOString(),
      minutos: Math.round((Date.now() - new Date(SESION.inicio).getTime())/60000),
      items: SESION.items, aciertos: SESION.aciertos, errores: SESION.errores,
      calificacion: SESION.calificacion || 0
    }
  };
  var cuerpo = JSON.stringify(paquete);

  try {
    if (navigator.sendBeacon){
      var blob = new Blob([cuerpo], {type:'text/plain;charset=UTF-8'});
      if (navigator.sendBeacon(BUZON, blob)) return;
    }
  } catch(e){}

  try {
    fetch(BUZON, {method:'POST', body:cuerpo, headers:{'Content-Type':'text/plain;charset=UTF-8'},
                  keepalive:true, mode:'no-cors'})['catch'](function(){});
  } catch(e){}
}

function abrirSesion(modo){
  SESION = { id: idSesion(), modo: modo, inicio: new Date().toISOString(),
             items:0, aciertos:0, errores:0, calificacion:0 };
}
function cerrarSesion(){
  if (SESION) enviar(true);
  SESION = null;
}

/* Avance guardado en el propio teléfono, solo para animar a la persona */
function avanceDe(temaId, modo){
  try {
    var g = JSON.parse(localStorage.getItem('cap_avance') || '{}');
    var r = g[modo + ':' + temaId];
    if (!r) return null;
    if (modo === 'tarjetas') return { pct: r.pct||0, txt: 'ya viste ' + (r.pct||0) + '%' };
    return { pct: r.pct||0, txt: 'tu mejor: ' + (r.pct||0) + '%' };
  } catch(e){ return null; }
}
function guardarAvance(temaId, modo, pct){
  try {
    var g = JSON.parse(localStorage.getItem('cap_avance') || '{}');
    var llave = modo + ':' + temaId;
    var previo = g[llave] ? (g[llave].pct||0) : 0;
    g[llave] = { pct: Math.max(previo, pct) };
    localStorage.setItem('cap_avance', JSON.stringify(g));
  } catch(e){}
}

function iniciarTarjetas(temaId){

function pintarTarjeta(){
  VISTA = 'tarjetas';

        '<div class="cuerpo">' + esc(c.f) + '</div></div>' +

        '<div class="cuerpo">' + esc(c.d) + '</div></div>' +

    '<div class="mando">' +
      '<button class="redondo flecha" id="btnAnterior"' + (TJ.i === 0 ? ' disabled' : '') +
        ' aria-label="Anterior">‹</button>' +
      '<button class="redondo mal' + (marca === 'repasar' ? ' puesta' : '') + '" id="btnMal"' +
        ' aria-label="Todavía no me la sé">✕ ' + TJ.mal + '</button>' +
      '<button class="redondo bien' + (marca === 'sabe' ? ' puesta' : '') + '" id="btnBien"' +
        ' aria-label="Ya me la sé">' + TJ.bien + ' ✓</button>' +
      '<button class="redondo flecha" id="btnSiguiente" aria-label="Siguiente">›</button>' +
    '</div>' +
    '<div class="pieMando">Marca ✕ si te falta repasarla o ✓ si ya te la sabes.<br>' +
      'Con las flechas te mueves sin calificarte.</div>';

  $('vista').innerHTML = h;
  $('volver').addEventListener('click', salirDeTarjetas);
  $('carta').addEventListener('click', voltear);
  $('voltear').addEventListener('click', voltear);
  $('btnAnterior').addEventListener('click', tarjetaAnterior);
  $('btnSiguiente').addEventListener('click', function(){ avanzarTarjeta(null); });
  $('btnMal').addEventListener('click', function(){ avanzarTarjeta('repasar'); });
  $('btnBien').addEventListener('click', function(){ avanzarTarjeta('sabe'); });
  window.scrollTo(0,0);
}

function voltear(){
  TJ.volteada = !TJ.volteada;
  pintarTarjeta();
}

function tarjetaAnterior(){
  if (TJ.i === 0) return;
  TJ.i--;
  TJ.volteada = false;
  CRONO = new Crono();
  pintarTarjeta();
}

/* resultado: 'sabe', 'repasar' o null (solo avanzar sin calificarse) */
function avanzarTarjeta(resultado){
  var t = TJ.tema, c = t.tarjetas[TJ.i];

  if (resultado){
    var previa = TJ.marcas[TJ.i];
    if (previa === 'sabe') TJ.bien--;
    if (previa === 'repasar') TJ.mal--;
    TJ.marcas[TJ.i] = resultado;
    if (resultado === 'sabe') TJ.bien++; else TJ.mal++;
    registrar('tarjetas', t.id, t.id + '-' + (TJ.i+1), c.f, '', resultado, CRONO.segundos());
    guardarAvance(t.id, 'tarjetas', Math.round((TJ.bien + TJ.mal) * 100 / t.tarjetas.length));
  }

  if (TJ.i >= t.tarjetas.length - 1) return finTarjetas();
  TJ.i++;
  TJ.volteada = false;
  CRONO = new Crono();
  pintarTarjeta();
}

function finTarjetas(){
  VISTA = 'fin-tarjetas';
  var t = TJ.tema;
  var calificadas = TJ.bien + TJ.mal;
  var pct = calificadas ? Math.round(TJ.bien * 100 / calificadas) : 0;
  cerrarSesion();

  var h = '<div class="marcador"><div class="num">' + TJ.bien + ' ✓</div>' +
          '<div class="lbl">' + TJ.mal + ' por repasar · ' + t.tarjetas.length + ' tarjetas</div></div>' +
          '<h2>Terminaste ' + esc(t.nombre) + '</h2>';
  h += calificadas
     ? '<p>Te sabías el ' + pct + '% de las que calificaste. ¡Bien ahí! Ahora ponte a prueba.</p>'
     : '<p>Ahora ponte a prueba con el cuestionario.</p>';
  h += '<button class="btn" id="alQuiz">Contestar el cuestionario de este tema</button>' +
       '<button class="btn sec" id="repetir">Volver a ver las tarjetas</button>' +
       '<button class="btn sec" id="otroTema">Estudiar otro tema</button>' +
       '<button class="btn fantasma" id="alMenu">Ir al inicio</button>';
  $('vista').innerHTML = h;
  $('alQuiz').addEventListener('click', function(){ iniciarCuestionario(t.id); });
  $('repetir').addEventListener('click', function(){ iniciarTarjetas(t.id); });
  $('otroTema').addEventListener('click', function(){ pintarTemas('tarjetas'); });
  $('alMenu').addEventListener('click', pintarMenu);
  window.scrollTo(0,0);
}

  cerrarSesion();
  pintarTemas('tarjetas');
}

/* =====================================================================
   MODO CUESTIONARIO
   ===================================================================== */
var CU = null;

function iniciarCuestionario(temaId){
  var lista = [], nombre = '';
  if (temaId === 'TODOS'){
    var vis = temasParaExamen();
    for (var i=0;i<vis.length;i++){
      for (var j=0;j<vis[i].preguntas.length;j++){
        lista.push({ q: vis[i].preguntas[j], tema: vis[i].id, n: j+1 });
      }
    }
    nombre = 'Cuestionario completo';
    lista = revolver(lista);
  } else {
    var t = temaPorId(temaId);
    if (!t) return pintarTemas('cuestionario');
    for (var k=0;k<t.preguntas.length;k++) lista.push({ q: t.preguntas[k], tema: t.id, n: k+1 });
    nombre = t.nombre;
    lista = revolver(lista);
  }
  abrirSesion('cuestionario');
  CU = { lista: lista, i: 0, bien: 0, nombre: nombre, temaId: temaId, contestada: false, fallos: [] };
  CRONO = new Crono();
  pintarPregunta();
}

function pintarPregunta(){
  VISTA = 'cuestionario';
  var it = CU.lista[CU.i], q = it.q;
  var pct = Math.round(CU.i * 100 / CU.lista.length);
  var h = '<button class="btn fantasma" id="volver">‹ Salir del cuestionario</button>' +
    '<div class="progreso"><span>' + (CU.i+1) + ' de ' + CU.lista.length + '</span>' +
    '<span class="riel"><i style="width:' + pct + '%"></i></span>' +
    '<span>' + CU.bien + ' ✓</span></div>' +
    '<div class="pregunta"><div class="txt">' + esc(q.p) + '</div></div>';
  for (var i=0;i<q.o.length;i++){
    h += '<button class="opcion" data-op="' + i + '">' + esc(q.o[i]) + '</button>';
  }
  h += '<div id="tras"></div>';
  $('vista').innerHTML = h;
  $('volver').addEventListener('click', salirDeCuestionario);
  var ops = $('vista').querySelectorAll('[data-op]');
  for (var k=0;k<ops.length;k++){
    ops[k].addEventListener('click', function(){ responder(parseInt(this.getAttribute('data-op'),10)); });
  }
  window.scrollTo(0,0);
}

function responder(elegida){
  if (CU.contestada) return;
  CU.contestada = true;
  var it = CU.lista[CU.i], q = it.q;
  var bien = elegida === q.r;
  if (bien) CU.bien++; else CU.fallos.push(q);

  var ops = $('vista').querySelectorAll('[data-op]');
  for (var i=0;i<ops.length;i++){
    var idx = parseInt(ops[i].getAttribute('data-op'),10);
    ops[i].setAttribute('disabled','disabled');
    if (idx === q.r) ops[i].className = 'opcion bien';
    else if (idx === elegida) ops[i].className = 'opcion mal';
  }

  registrar('cuestionario', it.tema, it.tema + '-p' + it.n, q.p, q.o[elegida],
            bien ? 'bien' : 'mal', CRONO.segundos());

  var ultima = CU.i >= CU.lista.length - 1;
  $('tras').innerHTML =
    '<div class="explica"><b>' + (bien ? '¡Correcto! ' : 'Ojo: ') + '</b>' + esc(q.x) + '</div>' +
    '<button class="btn" id="sig">' + (ultima ? 'Ver mi calificación' : 'Siguiente pregunta') + '</button>';
  $('sig').addEventListener('click', function(){
    if (ultima) return finCuestionario();
    CU.i++; CU.contestada = false; CRONO = new Crono(); pintarPregunta();
  });
  if ($('sig').scrollIntoView) $('sig').scrollIntoView({block:'nearest'});
}

function finCuestionario(){
  VISTA = 'fin-cuestionario';
  var total = CU.lista.length;
  var pct = Math.round(CU.bien * 100 / total);
  if (SESION) SESION.calificacion = pct;
  guardarAvance(CU.temaId, 'cuestionario', pct);
  cerrarSesion();

  var juicio = pct >= 90 ? '¡Excelente! Ya lo dominas, sigue así.'
             : pct >= 70 ? '¡Vas muy bien! Repasa lo que fallaste y sube tu marca.'
             : 'Todavía no, pero vas aprendiendo. Vuelve a las tarjetas, repite las veces que quieras y regresa cuando te sientas listo.';

  var h = '<div class="marcador"><div class="num">' + pct + '%</div>' +
          '<div class="lbl">' + CU.bien + ' de ' + total + ' correctas</div></div>' +
          '<h2>' + esc(juicio) + '</h2>';

  if (CU.fallos.length){
    h += '<div class="eyebrow">Lo que fallaste</div>';
    for (var i=0;i<CU.fallos.length;i++){
      h += '<div class="falla"><b>' + esc(CU.fallos[i].p) + '</b>' +
           esc(CU.fallos[i].o[CU.fallos[i].r]) + ' — ' + esc(CU.fallos[i].x) + '</div>';
    }
  }
  h += '<button class="btn" id="otra" style="margin-top:16px">Volver a contestarlo</button>' +
       '<button class="btn sec" id="aTarjetas">Repasar con tarjetas</button>' +
       '<button class="btn fantasma" id="alMenu">Ir al inicio</button>';
  $('vista').innerHTML = h;
  var temaId = CU.temaId;
  $('otra').addEventListener('click', function(){ iniciarCuestionario(temaId); });
  $('aTarjetas').addEventListener('click', function(){ pintarTemas('tarjetas'); });
  $('alMenu').addEventListener('click', pintarMenu);
  window.scrollTo(0,0);
}

function salirDeCuestionario(){
  if (SESION && CU) SESION.calificacion = Math.round(CU.bien * 100 / CU.lista.length);
  cerrarSesion();
  pintarTemas('cuestionario');
}

/* =====================================================================
   MODO REPORTE
   ===================================================================== */
function hijosDe(numero){
  var h = [];
  for (var i=0;i<DIRECTORIO.length;i++){
    if (DIRECTORIO[i].jefe && DIRECTORIO[i].jefe === numero && DIRECTORIO[i].num !== numero) h.push(DIRECTORIO[i]);
  }
  return h;
}
function descendencia(numero){
  var salida = [], pendientes = [numero], vistos = {};
  vistos[numero] = true;
  while (pendientes.length){
    var actual = pendientes.shift();
    var hs = hijosDe(actual);
    for (var i=0;i<hs.length;i++){
      if (vistos[hs[i].num]) continue;
      vistos[hs[i].num] = true;
      salida.push(hs[i]);
      pendientes.push(hs[i].num);
    }
  }
  return salida;
}

var DIAG = [];

function abrirReporte(){
  VISTA = 'reporte';
  RUTA = [];
  $('vista').innerHTML = '<button class="btn fantasma" id="volver">‹ Volver</button>' +
                         '<h1>Resultados de mi equipo</h1><p id="cargando">Consultando la bitácora…</p>';
  $('volver').addEventListener('click', pintarMenu);
  pedirReporte(function(ok){
    if (!ok) return pantallaFalloReporte();
    armarAvance();
    pintarNivel(USUARIO.num);
  });
}

function pantallaFalloReporte(){
  var h = '<button class="btn fantasma" id="volver2">‹ Volver</button>' +
    '<h1>Resultados de mi equipo</h1>' +
    '<div class="vencido"><b>No se pudo leer la bitácora</b>' +
    'La app sí abrió, pero el buzón donde se guardan los resultados no contestó.</div>' +
    '<div class="eyebrow" style="margin-top:18px">Qué pasó, paso por paso</div>';
  for (var i=0;i<DIAG.length;i++){
    h += '<div class="falla">' + esc(DIAG[i]) + '</div>';
  }
  h += '<div class="eyebrow" style="margin-top:18px">Cómo se arregla</div>' +
    '<div class="explica">En la Hoja de Google de la bitácora entra a <b>Extensiones → Apps Script</b>, ' +
    'luego <b>Implementar → Administrar implementaciones</b>, y con el lápiz de editar revisa que ' +
    '<b>“Quién tiene acceso” diga “Cualquier persona”</b> (no “Solo yo” ni “Cualquier persona con cuenta de Google”). ' +
    'Guarda como <b>Nueva versión</b> y vuelve a entrar aquí.</div>' +
    '<button class="btn" id="reintentar">Volver a intentar</button>' +
    '<button class="btn sec" id="abrirBuzon">Abrir el buzón en otra pestaña</button>';
  $('vista').innerHTML = h;
  $('volver2').addEventListener('click', pintarMenu);
  $('reintentar').addEventListener('click', function(){ DATOS_REPORTE = null; abrirReporte(); });
  $('abrirBuzon').addEventListener('click', function(){
    window.open(BUZON + '?fn=ping', '_blank');
  });
  window.scrollTo(0,0);
}

/* Primero por conexión directa; si no se puede, por el camino viejo (JSONP).
   Cada paso se anota en DIAG para poder ver dónde se atoró. */
function pedirReporte(alTerminar){
  if (DATOS_REPORTE){ armarAvance(); return alTerminar(true); }
  DIAG = ['1. Llamando al buzón: ' + BUZON.slice(0, 60) + '…'];
  var url = BUZON + '?fn=todo&t=' + Date.now();
  var yaTermino = false;
  function terminar(ok){ if (!yaTermino){ yaTermino = true; alTerminar(ok); } }

  var reloj = setTimeout(function(){
    DIAG.push('El buzón tardó más de 25 segundos en contestar.');
    terminar(!!DATOS_REPORTE);
  }, 25000);

  function cerrar(ok){ clearTimeout(reloj); terminar(ok); }

  try {
    fetch(url, { method:'GET' }).then(function(r){
      DIAG.push('2. El buzón contestó con código ' + r.status + '.');
      return r.text();
    }).then(function(txt){
      var dato = null;
      try { dato = JSON.parse(txt); } catch(e){}
      if (dato && dato.ok){
        DATOS_REPORTE = dato;
        if (dato.config) aplicarConfig(dato.config);
        DIAG.push('3. Datos recibidos: ' + ((dato.sesiones||[]).length) + ' sesiones registradas.');
        return cerrar(true);
      }
      if (dato && !dato.ok){
        DIAG.push('3. El buzón contestó con un error: ' + dato.error);
        return cerrar(false);
      }
      DIAG.push('3. Lo que llegó no son datos, parece una pantalla de Google. Casi siempre es porque la implementación pide iniciar sesión.');
      porJsonp(cerrar);
    })['catch'](function(e){
      DIAG.push('2. La conexión directa fue rechazada por Google (' + (e && e.message ? e.message : 'sin detalle') + '). Esto pasa cuando la implementación NO está abierta a "Cualquier persona".');
      porJsonp(cerrar);
    });
  } catch(e){
    DIAG.push('2. No se pudo ni intentar la conexión directa.');
    porJsonp(cerrar);
  }
}

function porJsonp(cerrar){
  DIAG.push('4. Intentando por el camino alterno…');
  var manejador = 'repTP' + Date.now().toString(36);
  var contesto = false;
  window[manejador] = function(resp){
    contesto = true;
    if (resp && resp.ok){
      DATOS_REPORTE = resp;
      if (resp.config) aplicarConfig(resp.config);
      DIAG.push('5. El camino alterno sí funcionó.');
      return cerrar(true);
    }
    DIAG.push('5. El camino alterno contestó, pero sin datos válidos.');
    cerrar(false);
  };
  var sc = document.createElement('script');
  sc.src = BUZON + '?fn=todo&t=' + Date.now() + '&callback=' + manejador;
  sc.onerror = function(){
    if (!contesto){ DIAG.push('5. El camino alterno tampoco cargó.'); cerrar(false); }
  };
  document.head.appendChild(sc);
  setTimeout(function(){
    if (!contesto){ DIAG.push('5. El camino alterno no contestó a tiempo.'); cerrar(false); }
  }, 15000);
}

/* ADV[numero][temaId] = {tarjetas:n, preguntas:n, bien:n} */
var ADV = null;
function armarAvance(){
  ADV = {};
  var lista = (DATOS_REPORTE && DATOS_REPORTE.avance) || [];
  for (var i=0;i<lista.length;i++){
    var r = lista[i];
    var num = norm(r.n);
    if (!ADV[num]) ADV[num] = {};
    if (!ADV[num][r.t]) ADV[num][r.t] = { tarjetas:0, preguntas:0, bien:0 };
    var c = ADV[num][r.t];
    if (r.m === 'tarjetas') c.tarjetas = Math.max(c.tarjetas, r.u||0);
    else { c.preguntas = Math.max(c.preguntas, r.u||0); c.bien = Math.max(c.bien, r.b||0); }
  }
}

/* Avance de una persona: lista de baterías con su porcentaje */
function avancePersona(persona){
  if (!ADV) armarAvance();
  var mias = bateriasDe(persona);
  var reg = ADV[norm(persona.num)] || {};
  var salida = [], completas = 0, suma = 0, sumaT = 0, sumaC = 0, hechos = 0, buenos = 0;
  for (var i=0;i<mias.length;i++){
    var t = mias[i];
    var c = reg[t.id] || { tarjetas:0, preguntas:0, bien:0 };
    var pctP = t.preguntas.length ? Math.round(c.preguntas * 100 / t.preguntas.length) : 0;
    var pctT = t.tarjetas.length  ? Math.round(c.tarjetas  * 100 / t.tarjetas.length)  : 0;
    if (pctP > 100) pctP = 100;
    if (pctT > 100) pctT = 100;
    var acierto = c.preguntas ? Math.round(c.bien * 100 / c.preguntas) : 0;
    if (pctP >= 100) completas++;
    suma += Math.round((pctT + pctP) / 2);
    sumaT += pctT; sumaC += pctP;
    hechos += c.preguntas; buenos += c.bien;
    salida.push({ tema:t, pctP:pctP, pctT:pctT, acierto:acierto, contestadas:c.preguntas,
                  totalP:t.preguntas.length, totalT:t.tarjetas.length,
                  vistasT:c.tarjetas, bien:c.bien });
  }
  var n = mias.length;
  return { lista: salida, completas: completas, total: n,
           general:  n ? Math.round(suma  / n) : 0,
           tarjetas: n ? Math.round(sumaT / n) : 0,
           quiz:     n ? Math.round(sumaC / n) : 0,
           contestadas: hechos, aciertos: buenos,
           acierto: hechos ? Math.round(buenos * 100 / hechos) : 0 };
}

function resumenDe(numeros){
  var set = {}, i;
  for (i=0;i<numeros.length;i++) set[numeros[i]] = true;
  var ses = (DATOS_REPORTE && DATOS_REPORTE.sesiones) || [];
  var personas = {}, r = { personas:0, sesiones:0, minutos:0, mejores:[] };
  for (i=0;i<ses.length;i++){
    var s = ses[i];
    if (!set[norm(s.numero)]) continue;
    r.sesiones++;
    r.minutos += s.minutos || 0;
    if (!personas[s.numero]) personas[s.numero] = { veces:0, minutos:0, mejor:0, ultima:'' };
    var p = personas[s.numero];
    p.veces++; p.minutos += s.minutos || 0;
    if (s.modo === 'cuestionario' && s.calificacion > p.mejor) p.mejor = s.calificacion;
    if (s.fin > p.ultima) p.ultima = s.fin;
  }
  r.personas = Object.keys(personas).length;
  r.detalle = personas;
  return r;
}

function pintarNivel(numero){
  var yo = buscarPersona(numero) || USUARIO;
  var equipo = descendencia(numero);
  var nums = [numero];
  for (var i=0;i<equipo.length;i++) nums.push(equipo[i].num);
  var res = resumenDe(nums);
  var directos = hijosDe(numero);
  var pctActivos = equipo.length ? Math.round(res.personas * 100 / equipo.length) : 0;
  var mio = avancePersona(yo);

  var h = '<button class="btn fantasma" id="atras">‹ ' + (RUTA.length ? 'Volver' : 'Ir al inicio') + '</button>' +
    '<div class="eyebrow">' + esc(yo.posicion || '') + '</div>' +
    '<h1>' + esc(yo.nombre || yo.num) + '</h1>' +
    '<div class="cifras">' +
      '<div class="cifra"><div class="n">' + res.personas + ' / ' + equipo.length + '</div><div class="l">Ya estudiaron</div></div>' +
      '<div class="cifra"><div class="n">' + pctActivos + '%</div><div class="l">Participación</div></div>' +
      '<div class="cifra"><div class="n">' + res.minutos + '</div><div class="l">Minutos totales</div></div>' +
      '<div class="cifra"><div class="n">' + res.sesiones + '</div><div class="l">Veces que entraron</div></div>' +
    '</div>' +
    '<button class="ficha" data-persona="' + esc(numero) + '">' +
      '<span><b>' + (numero === USUARIO.num ? 'Tu propio avance' : 'Avance de ' + esc(String(yo.nombre||'').split(' ')[0] || yo.num)) + '</b>' +
      '<small>Tarjetas ' + mio.tarjetas + '% · Cuestionarios ' + mio.quiz + '%' +
      (mio.contestadas ? ' · ' + mio.acierto + '% de aciertos' : '') + '</small></span>' +
      '<span class="marca">' + mio.general + '%</span></button>';

  if (directos.length){
    h += '<div class="eyebrow" style="margin-top:22px">Tu gente</div>';
    for (var k=0;k<directos.length;k++){
      var d = directos[k];
      var det = res.detalle[d.num];
      var hijos = hijosDe(d.num).length;
      var av = avancePersona(d);
      h += '<button class="ficha" data-num="' + esc(d.num) + '" data-hijos="' + hijos + '">' +
           '<span><b>' + esc(d.nombre || d.num) + '</b>' +
           '<small>' + esc(d.posicion) + (hijos ? ' · ' + hijos + ' a cargo' : '') +
           ' · ' + av.completas + ' de ' + av.total + ' baterías' + '</small></span>' +
           '<span class="marca">' + (det ? av.general + '%' : 'sin entrar') + '</span></button>';
    }
  } else {
    h += '<p style="color:var(--gris)">Aquí ya no hay más niveles.</p>';
  }

  var fallas = fallasDe(nums);
  if (fallas.length){
    h += '<div class="eyebrow" style="margin-top:22px">Lo que más falla tu gente</div>';
    for (var f=0; f<Math.min(10, fallas.length); f++){
      h += '<div class="falla"><b>' + esc(fallas[f].titulo) + '</b>' +
           fallas[f].porcentajeError + '% de error · ' + fallas[f].veces + ' respuestas · ' +
           fallas[f].segundosPromedio + ' s en promedio</div>';
    }
  }

  $('vista').innerHTML = h;
  $('atras').addEventListener('click', function(){
    if (RUTA.length){ var previo = RUTA.pop(); pintarNivel(previo); }
    else pintarMenu();
  });
  var yoBtn = $('vista').querySelector('[data-persona]');
  if (yoBtn) yoBtn.addEventListener('click', function(){ pintarPersona(numero, numero); });

  var fs = $('vista').querySelectorAll('[data-num]');
  for (var j=0;j<fs.length;j++){
    fs[j].addEventListener('click', function(){
      var destino = this.getAttribute('data-num');
      if (parseInt(this.getAttribute('data-hijos'),10) > 0){
        RUTA.push(numero);
        pintarNivel(destino);
      } else {
        pintarPersona(destino, numero);
      }
    });
  }
  window.scrollTo(0,0);
}

/* Un renglón de barra dentro de una batería */
function renglon(etiqueta, pct, hechos, total, extra){
  var clase = pct >= 100 ? '' : (pct > 0 ? 'medio' : 'cero');
  return '<div class="reng"><span class="et">' + etiqueta + '</span>' +
    '<span class="barra"><i class="' + clase + '" style="width:' + Math.max(pct,2) + '%"></i></span>' +
    '<span class="cif">' + hechos + '/' + total + '</span></div>' +
    (extra ? '<div class="nota">' + extra + '</div>' : '');
}

/* Detalle de una persona: qué batería lleva y cuál le falta */
function pintarPersona(numero, padre){
  var per = buscarPersona(numero);
  if (!per) return pintarNivel(padre);
  var av = avancePersona(per);
  var res = resumenDe([numero]);
  var det = res.detalle[numero] || res.detalle[norm(numero)];

  var h = '<button class="btn fantasma" id="atras">‹ Volver</button>' +
    '<div class="eyebrow">' + esc(per.posicion || '') + '</div>' +
    '<h1>' + esc(per.nombre || per.num) + '</h1>' +
    '<div class="cifras">' +
      '<div class="cifra"><div class="n">' + av.tarjetas + '%</div><div class="l">Tarjetas vistas</div></div>' +
      '<div class="cifra"><div class="n">' + av.quiz + '%</div><div class="l">Cuestionarios</div></div>' +
      '<div class="cifra"><div class="n">' + (av.contestadas ? av.acierto + '%' : '—') + '</div><div class="l">Aciertos</div></div>' +
      '<div class="cifra"><div class="n">' + av.completas + ' / ' + av.total + '</div><div class="l">Baterías terminadas</div></div>' +
      '<div class="cifra"><div class="n">' + (det ? det.minutos : 0) + '</div><div class="l">Minutos</div></div>' +
      '<div class="cifra"><div class="n">' + (det ? det.veces : 0) + '</div><div class="l">Veces que entró</div></div>' +
    '</div>';

  var pendientes = [];
  h += '<div class="eyebrow">Batería por batería</div>';
  for (var i=0;i<av.lista.length;i++){
    var r = av.lista[i];
    var lista = r.pctT >= 100 && r.pctP >= 100 ? '<span class="est ok">Terminada</span>'
              : (r.pctT > 0 || r.pctP > 0)      ? '<span class="est">En curso</span>'
                                                : '<span class="est no">Sin empezar</span>';
    if (r.pctT < 100 || r.pctP < 100) pendientes.push(r.tema.nombre);
    h += '<div class="bat"><div class="arriba"><b>' + r.tema.icono + ' ' + esc(r.tema.nombre) + '</b>' +
         lista + '</div>' +
         renglon('Tarjetas', r.pctT, r.vistasT, r.totalT, '') +
         renglon('Cuestionario', r.pctP, r.contestadas, r.totalP,
                 r.contestadas ? r.acierto + '% de aciertos' : '') +
         '</div>';
  }

  if (pendientes.length){
    h += '<div class="explica" style="margin-top:14px"><b>Le falta: </b>' + esc(pendientes.join(', ')) + '.</div>';
  } else if (av.total){
    h += '<div class="explica" style="margin-top:14px">Ya terminó todas sus baterías.</div>';
  }

  $('vista').innerHTML = h;
  $('atras').addEventListener('click', function(){ pintarNivel(padre); });
  window.scrollTo(0,0);
}

function fallasDe(numeros){
  /* El buzón entrega las fallas de todos; aquí no se puede filtrar por
     persona porque vienen agregadas, así que se muestran tal cual. */
  var lista = (DATOS_REPORTE && DATOS_REPORTE.fallas) || [];
  var salida = [];
  for (var i=0;i<lista.length;i++){
    if (lista[i].veces >= 2 && lista[i].porcentajeError > 0) salida.push(lista[i]);
  }
  return salida;
}

/* =====================================================================
   INACTIVIDAD Y ARRANQUE
   ===================================================================== */
var salioEn = 0;

function alCambiarVisibilidad(){
  if (document.hidden){
    salioEn = Date.now();
    if (CRONO) CRONO.pausa();
    enviar(false);
  } else {
    if (salioEn && Date.now() - salioEn > MINUTOS_INACTIVO*60*1000 && USUARIO){
      salir();
      salioEn = 0;
      return;
    }
    salioEn = 0;
    if (CRONO) CRONO.sigue();
  }
}

function bajarConfig(){
  var manejador = 'cfgTP' + Date.now().toString(36);
  var listo = false;
  window[manejador] = function(resp){
    listo = true;
    if (resp && resp.ok && resp.config) aplicarConfig(resp.config);
    try { delete window[manejador]; } catch(e){ window[manejador] = null; }
    if (VISTA === 'menu' && USUARIO) pintarMenu();
  };
  var sc = document.createElement('script');
  sc.src = BUZON + '?fn=config&t=' + Date.now() + '&callback=' + manejador;
  sc.onerror = function(){ listo = true; };
  document.head.appendChild(sc);
}

function arrancar(){
  $('sello').innerHTML = logoTP();
  cargarConfigGuardada();
  iniciarAcceso();
  $('btnSalir').addEventListener('click', salir);
  document.addEventListener('visibilitychange', alCambiarVisibilidad);
  window.addEventListener('pagehide', function(){ enviar(true); });

  try {
    var g = JSON.parse(sessionStorage.getItem('cap_usuario') || 'null');
    if (g && g.num){
      cargarDirectorio(function(){
        USUARIO = buscarPersona(g.num) || g;
        entrarApp();
      });
    }
  } catch(e){}

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')['catch'](function(){});
    });
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
else arrancar();
